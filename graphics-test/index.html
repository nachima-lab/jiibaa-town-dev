<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>じぃばぁの町｜操作確認</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#e9efdf;color:#334637}header{height:60px;background:#fffdf5;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}small{font-size:11px;color:#6b7a67}#view{position:relative;height:calc(100dvh - 132px);overflow:hidden;touch-action:none;background:#b7d19c}#world{position:absolute;left:0;top:0;width:1000px;height:750px;transform-origin:0 0;will-change:transform}#world svg{width:100%;height:100%}.spot{position:absolute;border:2px solid #fff9;border-radius:22px;background:#fff7;box-shadow:0 2px 10px #203b2940;padding:7px;font-size:15px;font-weight:bold;color:#294b34;transform:translate(-50%,-50%)}#tip{position:absolute;top:12px;left:12px;background:#fffdf0e8;border-radius:12px;padding:9px;font-size:12px;pointer-events:none}#dialog{position:absolute;bottom:14px;left:12px;right:12px;max-width:380px;margin:auto;background:#fffdf7;border-radius:16px;box-shadow:0 4px 24px #26392655;padding:16px;display:none}#dialog.on{display:block}#dialog h2{margin:0 0 7px;font-size:18px}#dialog p{font-size:14px;line-height:1.6}button{cursor:pointer}#close{background:#49784b;border:0;border-radius:10px;color:white;padding:10px 18px}footer{height:72px;display:flex;align-items:center;justify-content:space-around;background:#fffdf5;gap:6px;padding:8px}footer button{border:1px solid #bed2b8;border-radius:12px;background:#e7efe0;padding:11px 8px;color:#36573b;font-size:13px;font-weight:bold}#notice{position:absolute;right:10px;top:10px;background:#fffdf0e0;padding:7px;border-radius:9px;font-size:11px}</style></head><body>
<header><div><h1>🌱 じぃばぁの町</h1><small>独立した操作確認ページ・保存なし</small></div><small>グラフィック試作 0.1</small></header>
<div id="view"><div id="world">
<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grass" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#9dc982"/><circle cx="14" cy="25" r="3" fill="#b8d69a"/><path d="M39 45l4-7 4 7" fill="none" stroke="#78a85d" stroke-width="2"/></pattern><filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".22"/></filter></defs>
<rect width="1000" height="750" fill="url(#grass)"/><path d="M-30 575 Q240 420 480 510 T1040 320" fill="none" stroke="#e8c993" stroke-width="100"/><path d="M-30 575 Q240 420 480 510 T1040 320" fill="none" stroke="#f4dbaa" stroke-width="78"/>
<g filter="url(#sh)"><path d="M120 210l185-90 205 94-188 100z" fill="#81543a"/><path d="M150 211l170-79 170 79v190l-170 84-170-83z" fill="#f4e8ca"/><path d="M150 211l170 80 170-80v-38l-170-82-170 83z" fill="#5d6d70"/><path d="M320 291v194l170-84V211z" fill="#dbc4a0"/><path d="M235 340l78 35v88l-78-37z" fill="#94633f"/><path d="M370 329l75-36v80l-75 34z" fill="#805d41"/><path d="M386 329l43-20v45l-43 20z" fill="#d6e9d6"/></g>
<g filter="url(#sh)"><path d="M445 400l160-78 167 80-166 83z" fill="#8e5b37"/><path d="M445 400v85l161 85v-85z" fill="#75482f"/><path d="M606 485l166-83v85l-166 83z" fill="#986b43"/><g fill="#548a45"><circle cx="505" cy="401" r="17"/><circle cx="551" cy="378" r="18"/><circle cx="601" cy="358" r="19"/><circle cx="650" cy="380" r="17"/><circle cx="700" cy="407" r="17"/></g><g fill="#d95038"><circle cx="505" cy="415" r="13"/><circle cx="552" cy="396" r="13"/><circle cx="601" cy="377" r="13"/><circle cx="652" cy="399" r="13"/><circle cx="704" cy="421" r="13"/></g></g>
<g filter="url(#sh)"><path d="M530 565l150-74 160 80-150 75z" fill="#855333"/><path d="M530 565v42l160 83v-44z" fill="#694129"/><path d="M690 646l150-75v42l-150 77z" fill="#a36d42"/><g fill="#73a94e"><ellipse cx="600" cy="573" rx="18" ry="15"/><ellipse cx="646" cy="553" rx="18" ry="15"/><ellipse cx="694" cy="574" rx="18" ry="15"/><ellipse cx="739" cy="595" rx="18" ry="15"/></g></g>
<g filter="url(#sh)"><path d="M760 220v180" stroke="#795539" stroke-width="28"/><circle cx="754" cy="193" r="82" fill="#4f914b"/><circle cx="810" cy="207" r="64" fill="#6da95b"/><circle cx="716" cy="223" r="56" fill="#7db75d"/><circle cx="760" cy="156" r="58" fill="#80b861"/></g>
<g><circle cx="390" cy="488" r="27" fill="#e7b68c"/><path d="M365 515q25-22 50 0v60h-50z" fill="#597b9a"/><path d="M360 472q30-42 62 0z" fill="#d5b16b"/><text x="377" y="497" font-size="19">☺</text><circle cx="470" cy="541" r="27" fill="#e8bc9b"/><path d="M445 566q25-22 50 0v58h-50z" fill="#c7776e"/><path d="M443 528q27-35 54 0z" fill="#e9e9df"/><text x="458" y="550" font-size="19">☺</text></g>
<g fill="#e8f0d5"><circle cx="88" cy="382" r="9"/><circle cx="104" cy="390" r="8"/><circle cx="90" cy="401" r="8"/><circle cx="849" cy="472" r="9"/><circle cx="864" cy="483" r="8"/></g></svg>
<button class="spot" style="left:310px;top:335px" data-name="じぃばぁの家" data-info="木造の家。将来は住人の情報を開けるようにするよ。">🏠 家</button><button class="spot" style="left:388px;top:520px" data-name="じぃ" data-info="今日は畑を見に来たようだね。">👴 じぃ</button><button class="spot" style="left:475px;top:576px" data-name="ばぁ" data-info="野菜の収穫が楽しみだね。">👵 ばぁ</button><button class="spot" style="left:605px;top:445px" data-name="トマト畑" data-info="🍅 トマトが収穫できそう！">🍅 畑</button><button class="spot" style="left:692px;top:625px" data-name="野菜畑" data-info="🥬 こちらも育っているよ。">🥬 畑</button><button class="spot" style="left:760px;top:292px" data-name="大きな木" data-info="町の景色を彩る木だよ。">🌳 木</button></div><div id="tip">指で移動・2本指で拡大縮小<br>ボタンをタップすると説明が出るよ</div><div id="notice">※操作確認用の簡易イラスト</div><div id="dialog"><h2 id="dt"></h2><p id="dd"></p><button id="close">閉じる</button></div></div>
<footer><button id="minus">− 縮小</button><button id="reset">全体を見る</button><button id="plus">＋ 拡大</button><button id="harvest">🌾 一括収穫</button></footer>
<script>
const v=document.getElementById('view'),w=document.getElementById('world'),d=document.getElementById('dialog');let s=1,x=0,y=0,pointers=new Map(),start=null,oldDist=0,harvested=false;
function paint(){w.style.transform='translate('+x+'px,'+y+'px) scale('+s+')'}function fit(){s=Math.min(v.clientWidth/1000,v.clientHeight/750);x=(v.clientWidth-1000*s)/2;y=(v.clientHeight-750*s)/2;paint()}function zoom(k,cx=v.clientWidth/2,cy=v.clientHeight/2){let ns=Math.max(.35,Math.min(2.5,s*k));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;paint()}
document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('reset').onclick=fit;
function popup(t,body){document.getElementById('dt').textContent=t;document.getElementById('dd').textContent=body;d.classList.add('on')}document.getElementById('close').onclick=()=>d.classList.remove('on');document.querySelectorAll('.spot').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();popup(b.dataset.name,b.dataset.info)}));document.getElementById('harvest').onclick=()=>{if(harvested)return;harvested=true;popup('🌾 一括収穫完了！','🍅 トマト ×10 ／ 🥬 野菜 ×5 （操作確認のためデータ保存はありません）');let b=document.getElementById('harvest');b.disabled=true;b.style.opacity='.45'};
v.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#dialog'))return;v.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()];oldDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
v.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId);if(pointers.size===1){x+=e.clientX-p.x;y+=e.clientY-p.y;paint()}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(oldDist)zoom(dist/oldDist,(a[0].x+a[1].x)/2-v.getBoundingClientRect().left,(a[0].y+a[1].y)/2-v.getBoundingClientRect().top);oldDist=dist}});
for(let ev of ['pointerup','pointercancel'])v.addEventListener(ev,e=>{pointers.delete(e.pointerId);oldDist=0});window.addEventListener('resize',fit);fit();
</script></body></html>
