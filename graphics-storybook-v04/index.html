<footer><button id="minus">− 縮小</button><button id="reset">全体を見る</button><button id="plus">＋ 拡大</button><button id="collect">🌾 一括収穫</button></footer>
<script>
const view=document.getElementById('view'),world=document.getElementById('world'),info=document.getElementById('info');let scale=1,x=0,y=0,pointers=new Map(),oldDist=0;
function paint(){world.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function fit(){scale=Math.min(view.clientWidth/1000,view.clientHeight/750);x=(view.clientWidth-1000*scale)/2;y=(view.clientHeight-750*scale)/2;paint()}
function zoom(k,cx=view.clientWidth/2,cy=view.clientHeight/2){let ns=Math.max(.35,Math.min(2.4,scale*k));x=cx-(cx-x)*ns/scale;y=cy-(cy-y)*ns/scale;scale=ns;paint()}
function popup(title,desc){document.getElementById('title').textContent=title;document.getElementById('desc').textContent=desc;info.classList.add('show')}
document.getElementById('close').onclick=()=>info.classList.remove('show');
document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('reset').onclick=fit;
document.querySelectorAll('.sprite').forEach(el=>el.onclick=e=>{e.stopPropagation();popup(el.dataset.label,'この素材は背景と独立した画像だよ。ゲーム機能と保存はまだ組み込んでいないよ。')});
document.getElementById('collect').onclick=()=>popup('🌾 一括収穫','今回はグラフィックの確認用。収穫処理は未実装だよ。');
view.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#info'))return;view.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()];oldDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
view.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId);if(pointers.size===1){x+=e.clientX-p.x;y+=e.clientY-p.y;paint()}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(oldDist)zoom(d/oldDist,(a[0].x+a[1].x)/2-view.getBoundingClientRect().left,(a[0].y+a[1].y)/2-view.getBoundingClientRect().top);oldDist=d}});
for(const ev of ['pointerup','pointercancel'])view.addEventListener(ev,e=>{pointers.delete(e.pointerId);oldDist=0});window.addEventListener('resize',fit);fit();
</script></body></html>
