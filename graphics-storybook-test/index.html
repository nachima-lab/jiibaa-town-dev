*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f0f2e7;color:#354b38}header{height:63px;background:#fffdf5;padding:10px 13px;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}small{font-size:11px;color:#73806d}#viewport{position:relative;height:calc(100dvh - 137px);overflow:hidden;touch-action:none;background:#a9ca8d}#world{position:absolute;left:0;top:0;width:1000px;height:720px;transform-origin:0 0;background:radial-gradient(ellipse at 30% 20%,#d5e6a5,#90b975 90%)}.ground{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}.asset{position:absolute;border:0;padding:0;background:transparent;transform:translate(-50%,-50%);filter:drop-shadow(0 7px 5px #42613d44);touch-action:none}.asset svg{display:block;width:100%;height:100%}.asset:focus-visible{outline:3px solid #fff;border-radius:10px}.asset:active{filter:drop-shadow(0 0 12px #fff)}#hint{position:absolute;top:12px;left:12px;background:#fffbeedb;padding:10px 12px;border-radius:12px;font-size:12px;pointer-events:none}#dialog{position:absolute;bottom:12px;left:12px;right:12px;max-width:400px;margin:auto;background:#fffdf4f5;padding:16px;border-radius:17px;box-shadow:0 6px 22px #34492b55;display:none}#dialog.show{display:block}#dialog h2{font-size:18px;margin:0 0 8px}#dialog p{font-size:14px;line-height:1.6}#dialog button{border:0;border-radius:10px;background:#517a4b;color:white;padding:9px 16px}footer{height:74px;background:#fffdf5;display:flex;align-items:center;justify-content:space-evenly;gap:7px;padding:8px}footer button{font-size:13px;border:1px solid #c9d9bd;background:#e6eedf;border-radius:11px;padding:11px 8px;font-weight:700;color:#38553b}#version{font-size:11px;color:#72806c} .asset{transition:filter .12s} .asset:focus{outline:none} .asset:focus-visible{filter:drop-shadow(0 0 14px #fff)} .grass{position:absolute;pointer-events:none;font-size:25px;opacity:.9;text-shadow:1px 2px 2px <footer><button id="minus">− 縮小</button><button id="reset">全体を見る</button><button id="plus">＋ 拡大</button><button id="collect">🌾 一括収穫</button></footer>
<script>
const v=document.getElementById('viewport'),w=document.getElementById('world'),dialog=document.getElementById('dialog');let scale=1,x=0,y=0,p=new Map(),distance=0;
function paint(){w.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')'}function fit(){scale=Math.min(v.clientWidth/1000,v.clientHeight/720);x=(v.clientWidth-1000*scale)/2;y=(v.clientHeight-720*scale)/2;paint()}function zoom(k,cx=v.clientWidth/2,cy=v.clientHeight/2){let next=Math.min(2.6,Math.max(.32,scale*k));x=cx-(cx-x)*next/scale;y=cy-(cy-y)*next/scale;scale=next;paint()}
document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('reset').onclick=fit;
function show(t,s){document.getElementById('title').textContent=t;document.getElementById('desc').textContent=s;dialog.classList.add('show')}document.getElementById('close').onclick=()=>dialog.classList.remove('show');document.querySelectorAll('.asset').forEach(b=>b.onclick=()=>show(b.dataset.title,b.dataset.info));
document.getElementById('collect').onclick=()=>show('🌾 一括収穫','このページは見た目を改善するための試作だよ。収穫や倉庫保存はまだ実装していないよ。');
v.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#dialog'))return;v.setPointerCapture(e.pointerId);p.set(e.pointerId,{x:e.clientX,y:e.clientY});if(p.size===2){let a=[...p.values()];distance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
v.addEventListener('pointermove',e=>{if(!p.has(e.pointerId))return;let q=p.get(e.pointerId);if(p.size===1){x+=e.clientX-q.x;y+=e.clientY-q.y;paint()}p.set(e.pointerId,{x:e.clientX,y:e.clientY});if(p.size===2){let a=[...p.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(distance)zoom(d/distance,(a[0].x+a[1].x)/2-v.getBoundingClientRect().left,(a[0].y+a[1].y)/2-v.getBoundingClientRect().top);distance=d}});
for(const ev of ['pointerup','pointercancel'])v.addEventListener(ev,e=>{p.delete(e.pointerId);distance=0});window.addEventListener('resize',fit);fit();
</script></body></html>
